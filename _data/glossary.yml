- termo: "Git"
  categoria: "Desenvolvimento"
  descricao: "Sistema de versionamento que registra alterações em arquivos e facilita colaboração."
- termo: "GitHub"
  categoria: "Desenvolvimento"
  descricao: "Plataforma de hospedagem de repositórios Git, revisão de código e automações."
- termo: "Jekyll"
  categoria: "Desenvolvimento"
  descricao: "Gerador de sites estáticos que transforma Markdown, layouts e dados em páginas HTML."
- termo: "CI/CD"
  categoria: "Desenvolvimento"
  descricao: "Automação de integração, testes e entrega de alterações de software."
- termo: "Docker"
  categoria: "Desenvolvimento"
  descricao: "Ferramenta para executar aplicações em contêineres isolados em nível de sistema operacional."
- termo: "Container"
  categoria: "Desenvolvimento"
  descricao: "Ambiente isolado em nível de sistema operacional usado para executar aplicações com suas dependências."
  aliases: ["contêiner"]
- termo: "CPU"
  categoria: "Infraestrutura"
  descricao: "Unidade central de processamento, responsável por executar instruções e operações."
- termo: "RAM"
  categoria: "Infraestrutura"
  descricao: "Memória volátil de trabalho usada por aplicações e pelo sistema operacional."
- termo: "Cache"
  categoria: "Infraestrutura"
  descricao: "Armazenamento temporário que acelera o acesso a dados reutilizados."
- termo: "Backup"
  categoria: "Infraestrutura"
  descricao: "Cópia de dados destinada à recuperação em caso de perda ou falha."
- termo: "Cloud Computing"
  categoria: "Infraestrutura"
  descricao: "Uso sob demanda de recursos computacionais remotos, como servidores, redes e armazenamento."
  aliases: ["computação em nuvem"]
- termo: "Virtualização"
  categoria: "Infraestrutura"
  descricao: "Execução de múltiplos ambientes computacionais lógicos sobre recursos físicos compartilhados."
- termo: "SLA"
  categoria: "Infraestrutura"
  descricao: "Acordo de Nível de Serviço: define metas e compromissos entre fornecedor e cliente."
  aliases: ["Acordo de Nível de Serviço"]
- termo: "DNS Cache"
  categoria: "Infraestrutura"
  descricao: "Armazenamento temporário de respostas DNS para reduzir consultas repetidas."
  aliases: ["Cache DNS"]
