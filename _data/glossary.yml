# Glossario tecnico global: uma entrada por termo, aliases opcionais; descricoes originais curtas.
# Atualize este arquivo para refletir automaticamente nos posts antigos e novos.
# Fontes consultadas: OpServices, MAPA e TJAC; descricoes adaptadas e contextualizadas.
- termo: "Active Directory"
  categoria: "AD e Kerberos"
  descricao: "Serviço de diretório da Microsoft para centralizar usuários, computadores, grupos e políticas de um domínio."
  aliases: ["AD"]
  link: "https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/virtual-dc/active-directory-domain-services-overview"
- termo: "Domain Controller"
  categoria: "AD e Kerberos"
  descricao: "Servidor que hospeda o Active Directory e autentica identidades do domínio."
  aliases: ["DC", "controlador de domínio"]
- termo: "LDAP"
  categoria: "AD e Kerberos"
  descricao: "Protocolo para consultar e modificar entradas de um serviço de diretório, como o Active Directory."
- termo: "RootDSE"
  categoria: "AD e Kerberos"
  descricao: "Entrada especial na raiz LDAP que informa recursos e caminhos do diretório; frequentemente consultável sem credenciais."
  aliases: ["Root DSE"]
  link: "https://learn.microsoft.com/en-us/windows/win32/ad/rootdse"
- termo: "DN"
  categoria: "AD e Kerberos"
  descricao: "Distinguished Name: caminho completo de um objeto LDAP, formado por componentes como CN, OU e DC."
- termo: "Distinguished Name"
  categoria: "AD e Kerberos"
  descricao: "Nome completo de um objeto dentro da hierarquia LDAP; por exemplo, CN=Alice,OU=Users,DC=exemplo,DC=local."
- termo: "OU"
  categoria: "AD e Kerberos"
  descricao: "Organizational Unit: contêiner lógico para organizar objetos e aplicar políticas no Active Directory."
- termo: "GPO"
  categoria: "AD e Kerberos"
  descricao: "Group Policy Object: conjunto de configurações aplicáveis a usuários e computadores de um domínio."
  aliases: ["Group Policy"]
- termo: "SYSVOL"
  categoria: "AD e Kerberos"
  descricao: "Compartilhamento do domínio que armazena políticas e scripts replicados entre controladores de domínio."
- termo: "NETLOGON"
  categoria: "AD e Kerberos"
  descricao: "Compartilhamento que disponibiliza scripts de logon e recursos usados em ambientes Active Directory."
- termo: "Kerberos"
  categoria: "AD e Kerberos"
  descricao: "Protocolo de autenticação baseado em tickets, normalmente sem transmitir a senha aos serviços acessados."
  link: "https://learn.microsoft.com/en-us/windows-server/security/kerberos/kerberos-authentication-overview"
- termo: "KDC"
  categoria: "AD e Kerberos"
  descricao: "Key Distribution Center: serviço que emite tickets Kerberos, normalmente executado no controlador de domínio."
- termo: "TGT"
  categoria: "AD e Kerberos"
  descricao: "Ticket Granting Ticket: ticket inicial usado para solicitar tickets de serviços ao KDC."
- termo: "TGS"
  categoria: "AD e Kerberos"
  descricao: "Ticket Granting Service: parte do KDC que emite tickets para serviços; TGS também nomeia esses tickets em vários guias."
- termo: "TGS-REP"
  categoria: "AD e Kerberos"
  descricao: "Resposta do KDC que contém, entre outros dados, um ticket para um serviço solicitado pelo usuário."
- termo: "SPN"
  categoria: "AD e Kerberos"
  descricao: "Service Principal Name: identificador Kerberos que associa um nome de serviço à conta que o executa."
- termo: "S4U2Self"
  categoria: "AD e Kerberos"
  descricao: "Extensão Kerberos que permite a um serviço obter um ticket para si representando um usuário."
- termo: "S4U2Proxy"
  categoria: "AD e Kerberos"
  descricao: "Extensão Kerberos que permite a um serviço solicitar ticket a outro serviço em nome de um usuário, respeitando a delegação."
- termo: "Constrained Delegation"
  categoria: "AD e Kerberos"
  descricao: "Delegação Kerberos que limita a representação de usuários a serviços de destino autorizados."
  aliases: ["delegação Kerberos restrita", "KCD"]
- termo: "Unconstrained Delegation"
  categoria: "AD e Kerberos"
  descricao: "Delegação em que o serviço pode receber credenciais Kerberos delegáveis para acessar outros serviços, ampliando o risco."
  aliases: ["delegação irrestrita"]
- termo: "Protocol Transition"
  categoria: "AD e Kerberos"
  descricao: "Capacidade de um serviço utilizar S4U2Self para representar um usuário mesmo quando a autenticação inicial não foi Kerberos."
- termo: "Kerberoasting"
  categoria: "AD e Kerberos"
  descricao: "Técnica que solicita tickets de contas com SPN e tenta recuperar offline senhas fracas dessas contas."
- termo: "AS-REP Roasting"
  categoria: "AD e Kerberos"
  descricao: "Técnica que obtém respostas AS-REP de contas sem pré-autenticação Kerberos e testa senhas offline."
- termo: "Golden Ticket"
  categoria: "AD e Kerberos"
  descricao: "Ticket TGT falsificado usando a chave da conta KRBTGT, permitindo representar identidades no domínio comprometido."
- termo: "Silver Ticket"
  categoria: "AD e Kerberos"
  descricao: "Ticket de serviço falsificado usando a chave da conta do próprio serviço, com escopo diferente de um Golden Ticket."
- termo: "KRBTGT"
  categoria: "AD e Kerberos"
  descricao: "Conta especial do Active Directory cuja chave criptográfica protege os tickets iniciais emitidos pelo KDC."
- termo: "NTLM"
  categoria: "AD e Kerberos"
  descricao: "Conjunto de protocolos de autenticação da Microsoft que usa mecanismos de desafio e resposta."
- termo: "NTLM Relay"
  categoria: "AD e Kerberos"
  descricao: "Ataque que encaminha uma autenticação NTLM capturada para outro serviço que a aceite."
  aliases: ["relay NTLM"]
- termo: "Pass-the-Hash"
  categoria: "AD e Kerberos"
  descricao: "Autenticação NTLM realizada com o hash da senha, sem precisar conhecer a senha em texto claro."
  aliases: ["PtH"]
- termo: "NTDS.dit"
  categoria: "AD e Kerberos"
  descricao: "Banco de dados do Active Directory que contém objetos e material sensível de autenticação."
- termo: "SID"
  categoria: "AD e Kerberos"
  descricao: "Security Identifier: identificador numérico de uma conta ou grupo no Windows."
- termo: "RID"
  categoria: "AD e Kerberos"
  descricao: "Relative Identifier: parcela final de um SID que identifica a conta ou grupo no domínio."
- termo: "Backup Operators"
  categoria: "AD e Kerberos"
  descricao: "Grupo privilegiado do Windows que pode contornar algumas permissões de arquivos durante operações de backup e restauração."
- termo: "RBCD"
  categoria: "AD e Kerberos"
  descricao: "Resource-Based Constrained Delegation: delegação configurada no objeto do recurso que recebe a autenticação."
- termo: "DNS"
  categoria: "Redes"
  descricao: "Domain Name System: traduz nomes de hosts e domínios em registros, incluindo endereços e serviços."
- termo: "FQDN"
  categoria: "Redes"
  descricao: "Fully Qualified Domain Name: nome completo do host dentro do domínio DNS; exemplo: dc01.exemplo.local."
- termo: "SRV"
  categoria: "Redes"
  descricao: "Registro DNS que anuncia onde encontrar um serviço e em qual porta; muito usado pelo Active Directory."
  aliases: ["registro SRV"]
- termo: "MX"
  categoria: "Redes"
  descricao: "Registro DNS que indica servidores responsáveis por receber e-mails de um domínio."
  aliases: ["registro MX"]
- termo: "PTR"
  categoria: "Redes"
  descricao: "Registro DNS usado em resolução reversa: associa um endereço IP a um nome de host."
  aliases: ["registro PTR"]
- termo: "IP"
  categoria: "Redes"
  descricao: "Internet Protocol: protocolo de endereçamento e encaminhamento de pacotes em redes."
- termo: "IPv4"
  categoria: "Redes"
  descricao: "Versão do IP com endereços de 32 bits, geralmente escritos em quatro números decimais."
- termo: "IPv6"
  categoria: "Redes"
  descricao: "Versão do IP com endereços de 128 bits, escrita em grupos hexadecimais."
- termo: "TCP"
  categoria: "Redes"
  descricao: "Protocolo de transporte orientado à conexão que entrega dados em ordem e com controle de retransmissão."
- termo: "UDP"
  categoria: "Redes"
  descricao: "Protocolo de transporte sem conexão; prioriza simplicidade e menor overhead, sem garantir entrega."
- termo: "ICMP"
  categoria: "Redes"
  descricao: "Protocolo usado para mensagens de diagnóstico e controle de rede, incluindo o ping."
- termo: "ARP"
  categoria: "Redes"
  descricao: "Protocolo IPv4 que resolve endereços IP para endereços MAC dentro da rede local."
- termo: "CIDR"
  categoria: "Redes"
  descricao: "Notação que representa endereço de rede e tamanho do prefixo, como /24."
- termo: "Gateway"
  categoria: "Redes"
  descricao: "Equipamento ou endereço utilizado para encaminhar tráfego para fora da rede local."
- termo: "Subnet"
  categoria: "Redes"
  descricao: "Sub-rede: parcela de uma rede IP identificada por máscara ou prefixo."
  aliases: ["sub-rede"]
- termo: "Porta TCP"
  categoria: "Redes"
  descricao: "Número que identifica o serviço de destino ou origem de uma conexão TCP."
- termo: "SMB"
  categoria: "Redes"
  descricao: "Server Message Block: protocolo de acesso remoto a arquivos, impressoras e outros recursos Windows."
- termo: "SMB Signing"
  categoria: "Redes"
  descricao: "Assinatura que protege a integridade das mensagens SMB e dificulta adulteração e certos relays."
  aliases: ["SMB Signing required", "assinatura SMB"]
  link: "https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-signing-overview"
- termo: "SMBv1"
  categoria: "Redes"
  descricao: "Versão antiga do SMB com riscos conhecidos; seu uso deve ser evitado."
- termo: "NetBIOS"
  categoria: "Redes"
  descricao: "Conjunto de mecanismos legados para nomes e sessões em redes Windows."
- termo: "RPC"
  categoria: "Redes"
  descricao: "Remote Procedure Call: mecanismo para chamar procedimentos ou serviços em outro processo ou computador."
- termo: "RDP"
  categoria: "Redes"
  descricao: "Remote Desktop Protocol: protocolo da Microsoft para acesso gráfico remoto a sistemas Windows."
- termo: "WinRM"
  categoria: "Redes"
  descricao: "Windows Remote Management: serviço para executar tarefas administrativas remotas, geralmente via HTTP(S)."
- termo: "SSH"
  categoria: "Redes"
  descricao: "Secure Shell: protocolo criptografado para acesso e execução remota de comandos."
- termo: "HTTP"
  categoria: "Redes"
  descricao: "Protocolo de requisições e respostas usado na Web."
- termo: "HTTPS"
  categoria: "Redes"
  descricao: "HTTP protegido por TLS para confidencialidade e autenticidade do tráfego."
- termo: "TLS"
  categoria: "Redes"
  descricao: "Protocolo de segurança usado para criptografar e autenticar conexões de rede."
- termo: "Firewall"
  categoria: "Redes"
  descricao: "Mecanismo que permite ou bloqueia tráfego conforme regras de rede, host ou aplicação."
- termo: "Reverse Shell"
  categoria: "Pentest"
  descricao: "Conexão iniciada pelo alvo para entregar ao operador uma sessão remota de comandos."
  aliases: ["shell reversa"]
- termo: "Bind Shell"
  categoria: "Pentest"
  descricao: "Shell que aguarda conexões de entrada em uma porta aberta no alvo."
- termo: "RCE"
  categoria: "Pentest"
  descricao: "Remote Code Execution: capacidade de executar código no sistema-alvo a partir de outro dispositivo."
  aliases: ["Remote Code Execution"]
- termo: "LPE"
  categoria: "Pentest"
  descricao: "Local Privilege Escalation: aumento de privilégios após obter acesso ao sistema."
  aliases: ["Privilege Escalation", "escalada de privilégios"]
- termo: "CTF"
  categoria: "Pentest"
  descricao: "Capture The Flag: desafio prático de segurança com objetivos e provas de conclusão, como flags."
- termo: "Pentest"
  categoria: "Pentest"
  descricao: "Teste de segurança autorizado que procura e demonstra vulnerabilidades reais em um escopo definido."
- termo: "Enumeração"
  categoria: "Pentest"
  descricao: "Coleta estruturada de detalhes sobre serviços, contas, permissões, versões e recursos de um alvo."
  aliases: ["Enumeration"]
- termo: "Reconhecimento"
  categoria: "Pentest"
  descricao: "Etapa de mapeamento inicial dos ativos e tecnologias antes de testes mais específicos."
  aliases: ["Recon", "Reconnaissance"]
- termo: "Exploit"
  categoria: "Pentest"
  descricao: "Código ou procedimento que aproveita uma vulnerabilidade para produzir um efeito."
- termo: "Payload"
  categoria: "Pentest"
  descricao: "Conteúdo executado ou entregue durante uma exploração, como comandos ou programas."
- termo: "CVE"
  categoria: "Pentest"
  descricao: "Identificador público padronizado de uma vulnerabilidade de segurança conhecida."
- termo: "CVSS"
  categoria: "Pentest"
  descricao: "Sistema de pontuação que estima a severidade técnica de uma vulnerabilidade."
- termo: "PoC"
  categoria: "Pentest"
  descricao: "Proof of Concept: demonstração que comprova uma hipótese ou comportamento técnico."
  aliases: ["Proof of Concept"]
- termo: "Wordlist"
  categoria: "Pentest"
  descricao: "Lista de palavras ou candidatos utilizada em descoberta de conteúdo e testes de senha."
  aliases: ["lista de palavras"]
- termo: "Password Spraying"
  categoria: "Pentest"
  descricao: "Teste de uma senha ou poucas senhas contra vários usuários, respeitando o risco de bloqueios."
- termo: "Brute Force"
  categoria: "Pentest"
  descricao: "Tentativa sistemática de múltiplas combinações para descobrir uma senha ou valor."
- termo: "Hash"
  categoria: "Pentest"
  descricao: "Resultado de uma função criptográfica de sentido único usada para verificar integridade ou senhas."
- termo: "Hashcat"
  categoria: "Ferramentas"
  descricao: "Ferramenta de teste offline de senhas e hashes, com diversos algoritmos e modos."
- termo: "John the Ripper"
  categoria: "Ferramentas"
  descricao: "Ferramenta de auditoria offline de senhas que suporta múltiplos formatos de hash."
  aliases: ["John"]
- termo: "Hydra"
  categoria: "Ferramentas"
  descricao: "Ferramenta para testar combinações de credenciais em diversos protocolos de autenticação."
- termo: "Nmap"
  categoria: "Ferramentas"
  descricao: "Ferramenta para descobrir hosts, portas e características de serviços em redes."
- termo: "NetExec"
  categoria: "Ferramentas"
  descricao: "Ferramenta de enumeração e validação de autenticação em protocolos de rede, comum em laboratórios AD."
  aliases: ["CrackMapExec"]
- termo: "Impacket"
  categoria: "Ferramentas"
  descricao: "Biblioteca e coleção de utilitários Python para trabalhar com protocolos de rede, SMB e Kerberos."
- termo: "winPEAS"
  categoria: "Ferramentas"
  descricao: "Ferramenta de enumeração local que busca indícios de configuração vulnerável e possibilidades de escalação no Windows."
- termo: "LinPEAS"
  categoria: "Ferramentas"
  descricao: "Ferramenta de enumeração local de permissões e configurações potencialmente vulneráveis em Linux."
- termo: "Metasploit"
  categoria: "Ferramentas"
  descricao: "Framework modular de testes de segurança com exploits, payloads e sessões controladas."
- termo: "Responder"
  categoria: "Ferramentas"
  descricao: "Ferramenta de laboratório que captura tentativas de autenticação em certos protocolos e respostas de rede."
- termo: "Burp Suite"
  categoria: "Ferramentas"
  descricao: "Proxy de teste usado para inspecionar e modificar requisições e respostas web."
- termo: "ffuf"
  categoria: "Ferramentas"
  descricao: "Ferramenta de fuzzing e descoberta de caminhos, parâmetros e recursos web."
- termo: "CeWL"
  categoria: "Ferramentas"
  descricao: "Ferramenta que extrai palavras de páginas web para criar listas de candidatos de senha."
- termo: "CUPP"
  categoria: "Ferramentas"
  descricao: "Ferramenta que gera candidatos de senha a partir de dados de perfil de uma pessoa."
- termo: "PsExec"
  categoria: "Windows"
  descricao: "Técnica e ferramenta de execução remota Windows que pode usar o serviço de controle e compartilhamentos administrativos."
  aliases: ["psexec.py"]
- termo: "AutoLogon"
  categoria: "Windows"
  descricao: "Recurso que realiza entrada automática de uma conta; configurações inseguras podem expor senhas no Registro."
  aliases: ["Winlogon AutoLogon"]
- termo: "LocalSystem"
  categoria: "Windows"
  descricao: "Conta interna muito privilegiada que executa serviços e tarefas do Windows."
  aliases: ["NT AUTHORITY\\\\SYSTEM", "SYSTEM"]
- termo: "UAC"
  categoria: "Windows"
  descricao: "User Account Control: separa e solicita elevação para ações administrativas em sistemas Windows."
- termo: "LSASS"
  categoria: "Windows"
